<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1420"><title>호남각 프리미엄 AR 포토존</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#09111d;color:#f7ecd6;font-family:system-ui,"Noto Sans KR",sans-serif}button{font:inherit;cursor:pointer} .shell{max-width:1200px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.brand{font-family:Georgia,serif;letter-spacing:.14em;color:#e8c78b;font-size:17px}.hint{font-size:12px;color:#d0c0a6}.layout{display:grid;grid-template-columns:minmax(300px,1fr) 290px;gap:14px}.stage{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#0e1b2d;touch-action:none;box-shadow:0 12px 35px #0008}.photo,.cam{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.cam{display:none}.photo{filter:contrast(1.05)}.shade{position:absolute;inset:0;background:linear-gradient(#030b15a8,transparent 25%,transparent 70%,#07121cc9);pointer-events:none}.caption{position:absolute;top:3%;left:3%;right:3%;pointer-events:none;text-shadow:0 2px 8px #000}.caption h2{font-family:serif;font-size:clamp(15px,2.4vw,27px);margin:0;color:#f3d99e}.caption p{font-size:clamp(9px,1.3vw,15px);margin:4px 0}.footer{position:absolute;bottom:2%;width:100%;text-align:center;color:#f3d99e;text-shadow:0 2px 7px #000;pointer-events:none;font-size:clamp(10px,1.3vw,16px)}.sprite{position:absolute;touch-action:none;user-select:none;cursor:grab;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px #0009)}.sprite img{width:100%;height:100%;object-fit:contain;pointer-events:none}.sprite.selected{outline:2px dashed #e3c88f;border-radius:10px}.panel{background:#152237;border:1px solid #5e513f;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:13px}.panel h3{margin:0;color:#e6c88f;font-size:17px}.panel label{font-size:12px;color:#e8d7ba}.btn{border:1px solid #9e8359;background:#223247;color:#f7ead4;border-radius:10px;padding:11px}.btn.primary{background:#e5c68e;color:#162132;font-weight:700}.btn.active{background:#65523a}.options{display:grid;grid-template-columns:1fr 1fr;gap:6px}.range{width:100%;accent-color:#d9b67d}.status{font-size:12px;line-height:1.6;color:#c8c0b5}.toolbar{display:flex;gap:7px}.toolbar>*{flex:1}.result{display:none;position:fixed;inset:0;background:#07101af2;z-index:50;overflow:auto;text-align:center;padding:20px}.result img{max-height:72vh;max-width:95vw;border:1px solid #bfa16c}.result a{display:inline-block;background:#e7c78b;color:#121e2b;text-decoration:none;padding:12px 18px;border-radius:9px;margin:12px}.result button{padding:12px;border-radius:9px}.help{font-size:11px;color:#b8aa92}@media(max-width:800px){.layout{grid-template-columns:1fr}.stage{aspect-ratio:3/4}.shell{padding:7px}.panel{padding:12px}.brand{font-size:14px}.hint{font-size:10px}.caption h2{font-size:16px}.caption p,.footer{font-size:10px}} 
</style></head><body><div class="shell"><div class="top"><div><div class="brand">HONAMGAK · AR PHOTO ZONE</div><div class="hint">따뜻한 공간, 소중한 추억</div></div><div class="hint" id="clock"></div></div><div class="layout"><div class="stage" id="stage"><img class="photo" id="background" src="assets/honamgak_night_preview.jpg" alt="실제 호남각 정면 야간 미리보기"><video class="cam" id="camera" playsinline autoplay muted></video><div class="shade"></div><div id="sprites"></div><div class="caption"><h2>따뜻한 공간, 소중한 추억</h2><p>우리의 정성이 인연을 만듭니다.</p></div><div class="footer">호남각 · HONAMGAK &nbsp; | &nbsp; <span id="stamp"></span></div></div><aside class="panel"><h3>포토존 설정</h3><label>배경 선택</label><div class="toolbar"><button class="btn active" id="previewMode">호남각 야경</button><button class="btn" id="cameraMode">실제 카메라</button></div><button class="btn" id="flip">전·후면 카메라 전환</button><label>캐릭터 선택 · 드래그로 이동</label><div class="options" id="options"></div><label>선택 캐릭터 크기 <span id="sizeLabel"></span></label><input class="range" id="size" type="range" min="55" max="280" value="130"><div class="toolbar"><button class="btn" id="all">모두 표시</button><button class="btn" id="reset">기본 배치</button></div><button class="btn primary" id="shoot">사진 촬영 및 저장</button><div class="status" id="status">실제 호남각 사진을 야간 톤으로 보정한 배경입니다. 캐릭터를 터치해 위치를 옮기고 크기를 조절하세요.</div><div class="help">※ 캐릭터는 이전 제작 이미지에서 추출한 2D PNG입니다. 실제 공간 추적형 3D AR은 아닙니다. 사진은 기기에서 생성되며 서버로 전송하지 않습니다.</div></aside></div></div><div class="result" id="result"><h3>호남각에서의 소중한 추억</h3><img id="saved" alt="촬영 결과"><div><a id="download" download="HONAMGAK.png">사진 다운로드</a><button class="btn" id="back">돌아가기</button></div></div><script>
const $=s=>document.querySelector(s),stage=$('#stage'),vid=$('#camera'),bg=$('#background');let stream=null,facing='environment',mode='preview',selected='santa';
const original=[{id:'santa',name:'한복 산타',src:'assets/santa.png',x:.15,y:.65,w:.22,show:true},{id:'tiger',name:'아기 호랑이',src:'assets/tiger.png',x:.21,y:.82,w:.17,show:true},{id:'horse',name:'붉은 말',src:'assets/horse.png',x:.86,y:.62,w:.24,show:true},{id:'sheep',name:'흰 양',src:'assets/sheep.png',x:.79,y:.84,w:.17,show:true}];let chars=structuredClone(original),images={};for(const c of chars){let i=new Image();i.src=c.src;images[c.id]=i}
function today(){let d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}$('#clock').textContent=today();$('#stamp').textContent=today();
function paint(){const host=$('#sprites');host.innerHTML='';$('#options').innerHTML='';for(const c of chars){const b=document.createElement('button');b.className='btn'+(selected===c.id?' active':'');b.textContent=(c.show?'✓ ':'○ ')+c.name;b.onclick=()=>{if(selected===c.id)c.show=!c.show;else{selected=c.id;c.show=true}paint()};$('#options').append(b);if(!c.show)continue;const el=document.createElement('div');el.className='sprite'+(selected===c.id?' selected':'');el.style.left=(c.x*100)+'%';el.style.top=(c.y*100)+'%';el.style.width=(c.w*100)+'%';el.style.aspectRatio='1/1';el.innerHTML=`<img src="${c.src}" alt="${c.name}" draggable="false">`;let pointer=null,startX=0,startY=0;el.addEventListener('pointerdown',e=>{selected=c.id;pointer=e.pointerId;el.setPointerCapture(pointer);startX=e.clientX;startY=e.clientY;el.classList.add('selected');updateRange();});el.addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;const r=stage.getBoundingClientRect();c.x=Math.max(.04,Math.min(.96,c.x+(e.clientX-startX)/r.width));c.y=Math.max(.08,Math.min(.95,c.y+(e.clientY-startY)/r.height));startX=e.clientX;startY=e.clientY;el.style.left=c.x*100+'%';el.style.top=c.y*100+'%'});el.addEventListener('pointerup',e=>{pointer=null;paint()});host.append(el)}updateRange()}
function updateRange(){const c=chars.find(c=>c.id===selected);$('#size').value=Math.round(c.w*600);$('#sizeLabel').textContent=Math.round(c.w*100)+'% 화면 너비'}
$('#size').oninput=e=>{chars.find(c=>c.id===selected).w=+e.target.value/600;paint()};
$('#reset').onclick=()=>{chars=structuredClone(original);selected='santa';paint()};
$('#all').onclick=()=>{const anyHidden=chars.some(c=>!c.show);chars.forEach(c=>c.show=anyHidden);paint()};
function status(s){$('#status').textContent=s}
async function cameraStart(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 접속이 필요합니다');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});vid.srcObject=stream;await vid.play();vid.style.display='block';bg.style.display='none';mode='camera';$('#cameraMode').classList.add('active');$('#previewMode').classList.remove('active');status('카메라가 켜졌습니다. 화면에서 캐릭터를 이동한 뒤 촬영하세요.')}catch(e){status('카메라를 열 수 없습니다: '+e.message+' · 휴대폰 HTTPS 주소와 카메라 권한을 확인하세요.')}}
$('#cameraMode').onclick=cameraStart;
$('#previewMode').onclick=()=>{mode='preview';vid.style.display='none';bg.style.display='block';$('#cameraMode').classList.remove('active');$('#previewMode').classList.add('active');status('실제 호남각 사진으로 미리보기 중입니다.')};
$('#flip').onclick=()=>{facing=facing==='environment'?'user':'environment';cameraStart()};
function cover(ctx,img,W,H,mirror=false){const iw=img.videoWidth||img.naturalWidth,ih=img.videoHeight||img.naturalHeight;if(!iw||!ih)return;let s=Math.max(W/iw,H/ih),sw=iw*s,sh=ih*s;ctx.save();if(mirror){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(img,(W-sw)/2,(H-sh)/2,sw,sh);ctx.restore()}
$('#shoot').onclick=async()=>{let W=1200,H=Math.round(W*stage.clientHeight/stage.clientWidth),canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;let ctx=canvas.getContext('2d');ctx.fillStyle='#09121d';ctx.fillRect(0,0,W,H);if(mode==='camera'&&vid.readyState>=2)cover(ctx,vid,W,H,facing==='user');else cover(ctx,bg,W,H);
ctx.fillStyle='#08152277';ctx.fillRect(0,0,W,H*.17);ctx.fillStyle='#f2d69d';ctx.textAlign='center';ctx.font=`bold ${Math.round(W*.035)}px serif`;ctx.fillText('따뜻한 공간, 소중한 추억',W/2,H*.067);ctx.font=`${Math.round(W*.019)}px sans-serif`;ctx.fillText('우리의 정성이 인연을 만듭니다.',W/2,H*.102);
for(const c of chars){if(!c.show)continue;const im=images[c.id];if(!im.complete||!im.naturalWidth){await new Promise(r=>{im.onload=r;im.onerror=r})}if(im.naturalWidth){let w=c.w*W,h=w;ctx.shadowColor='#0009';ctx.shadowBlur=18;ctx.drawImage(im,c.x*W-w/2,c.y*H-h/2,w,h);ctx.shadowBlur=0}}
ctx.fillStyle='#091521a6';ctx.fillRect(0,H*.92,W,H*.08);ctx.fillStyle='#efd6a0';ctx.textAlign='center';ctx.font=`${Math.round(W*.025)}px serif`;ctx.fillText('호남각 · HONAMGAK    |    '+today(),W/2,H*.968);
let data=canvas.toDataURL('image/png');$('#saved').src=data;$('#download').href=data;$('#download').download='HONAMGAK_'+today()+'.png';$('#result').style.display='block';status('사진이 생성되었습니다. 다운로드 버튼을 눌러 저장하세요.')};
$('#back').onclick=()=>$('#result').style.display='none';paint();
</script></body></html>
